<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Proyek</title>
    
    <link rel="stylesheet" href="../styles/gallery.css">
</head>
<body>

    <main>
        <section id="gallery">
            <h2>Galeri Proyek</h2>
            
            <div class="gallery">
                <article class="gallery-item">
                    <img src="../assets/images/Jembatan hidrolik.jpeg" alt="DIY Jembatan Hidrolik">
                    <h3>Jembatan Hidrolik</h3>
                </article>
                <article class="gallery-item">
                    <img src="../assets/images/Lightstik-DIY.jpeg" alt="Lightstick-DIY">
                    <h3>Lightstick Super Mario</h3>
                </article>
                <article class="gallery-item">
                    <img src="../assets/images/Miniatur makanan.jpeg" alt="Miniatur Makanan">
                    <h3>Miniatur Makanan</h3>
                </article>
                <article class="gallery-item">
                    <img src="../assets/images/3D Isometric Stranger Things.jpeg" alt="3D background Horror Isometric">
                    <h3>3D Isometric Horor Stranger Things</h3>
                </article>
                <article class="gallery-item">
                    <img src="../assets/images/3D Isometric Tanaman.jpeg" alt="3D Background Tanaman Isometric">
                    <h3>3D Isometric Tanaman</h3>
                </article>
                <article class="gallery-item">
                    <img src="../assets/images/Scrapbook .jpeg" alt="Scrapbook Kebersamaan Keluarga">
                    <h3>Scrapbook Kebersamaan</h3>
                </article>
                
            </div>
        </section>
    </main>

    <footer>
        <a href="#">Kembali ke Beranda</a>

</html>
