<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Saya</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    #contact {
      padding: 40px 20px;
    }

    .contact-form {
      width: 400px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .contact-form h2 {
      text-align: center;
      color: #1e293b;
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      color: #334155;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      height: 100px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #1e3a8a;
      background-color: #f1f5f9;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
    }

    .btn-submit {
      background-color: #264db8;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    .btn-submit:hover {
      background-color: #1c366e;
    }

    .footer-link {
      text-align: center;
      margin-top: 24px;
    }

    .footer-link a {
      color: #6d28d9;
      text-decoration: underline;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Bagian Kontak dengan ID #contact -->
  <section id="contact">
    <div class="contact-form">
      <h2>Hubungi Saya</h2>
      
      <form action="#" method="POST">
        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>
    </div>

    <div class="footer-link">
      <a href="#">Kembali ke Beranda</a>
    </div>
  </section>

</body>
</html>
